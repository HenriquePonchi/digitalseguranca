{# Campo de formulário com label, obrigatoriedade, ajuda e erros próximos. Uso: {% include 'avaliacao/componentes/campo.html' with field=form.nome %} #}
<div class="campo{% if field.errors %} campo--erro{% endif %}">
    <label class="campo__label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="campo__req" aria-hidden="true">*</span><span class="sr-only"> (obrigatório)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="campo__ajuda">{{ field.help_text }}</p>{% endif %}
    {% for erro in field.errors %}<p class="campo__erro" role="alert"><svg class="ico" aria-hidden="true"><use href="#i-alert-circle"/></svg>{{ erro }}</p>{% endfor %}
</div>
