{# Medidor semicircular 1–4. Os quatro quadrantes coincidem com os limites de classe do score geral (1,75 · 2,50 · 3,25). #}
{# Parâmetros: valor (string/None), rotulo, classe (opcional) #}
{% load ui %}
<figure class="gauge" style="--p:{{ valor|pct:'1,4' }}">
    <div class="gauge__dial">
    <svg class="gauge__svg" viewBox="0 0 220 124" role="img" aria-label="{{ rotulo }}: {% if valor %}{{ valor|floatformat:2 }} em uma escala de 1 a 4{% else %}sem dados aplicáveis{% endif %}">
        <defs><linearGradient id="gauge-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
        <path class="gauge__zona gauge__zona--1" d="M20 110A90 90 0 0 1 200 110" pathLength="100"/>
        <path class="gauge__zona gauge__zona--2" d="M20 110A90 90 0 0 1 200 110" pathLength="100"/>
        <path class="gauge__zona gauge__zona--3" d="M20 110A90 90 0 0 1 200 110" pathLength="100"/>
        <path class="gauge__zona gauge__zona--4" d="M20 110A90 90 0 0 1 200 110" pathLength="100"/>
        {% if valor %}<path class="gauge__valor" d="M20 110A90 90 0 0 1 200 110" pathLength="100"/>{% endif %}
    </svg>
    <div class="gauge__centro">
        <span class="gauge__num tnum">{% if valor %}{{ valor|floatformat:2 }}{% else %}—{% endif %}</span>
        <span class="gauge__rot">{% if valor %}{{ rotulo }}{% else %}Sem dados aplicáveis{% endif %}</span>
        {% if classe and valor %}<span class="badge badge--cyan">{{ classe }}</span>{% endif %}
    </div>
    </div>
    <ol class="gauge__escala" aria-label="Classes de maturidade do score geral">
        <li{% if classe == 'Inicial' %} class="is-atual" aria-current="true"{% endif %}><b>Inicial</b><span>abaixo de 1,75</span></li>
        <li{% if classe == 'Intermediário' %} class="is-atual" aria-current="true"{% endif %}><b>Intermediário</b><span>1,75 a 2,50</span></li>
        <li{% if classe == 'Gerenciado' %} class="is-atual" aria-current="true"{% endif %}><b>Gerenciado</b><span>2,50 a 3,25</span></li>
        <li{% if classe == 'Otimizado' %} class="is-atual" aria-current="true"{% endif %}><b>Otimizado</b><span>a partir de 3,25</span></li>
    </ol>
</figure>
